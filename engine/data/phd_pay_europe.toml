# PhD pay across Europe: the data behind the dashboard's "PhD pay map" tab (engine/tools/web/paymap.js).
#
# What every number means (monthly, EUR, averaged over the year, so 13th/14th months, holiday pay
# and year-end bonuses are spread across the 12 months):
#   gross   what the contract or scholarship pays before anything is taken off
#   net     what reaches the bank after income tax and employee social contributions
#   rent    a studio for one person in `city` (the "housing market" view)
#   living  everything one person spends in `city` in a month, rent included: food, power,
#           internet, phone, transport, insurance (mandatory health insurance where it exists), other
#   pli     price level index for household consumption, EU27 = 100 (Eurostat-style); the map's
#           PPP view divides net pay by pli/100
# The map derives the rest: tax = 1 - net/gross; PPP = net / (pli/100); left over = net - living.
#
# These are ESTIMATES, hand-assembled in November 2026 from public pay scales and typical city
# costs, not pulled from one official dataset. `confidence` says how firm each row is. Update a
# row whenever you check a real offer (a PhD ad that states the salary beats any row here), and
# move `as_of` forward.

[meta]
as_of = "2026-11-21"
basis = "One person, own studio, one typical PhD city per country, year-average monthly EUR."

